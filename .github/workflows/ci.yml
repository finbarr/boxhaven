name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
        continue-on-error: true

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Audit production dependencies
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Build backend
        run: npm --prefix backend run build

      - name: Test backend
        run: npm --prefix backend test

  backup:
    name: Backup Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install backup test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Test backup integrity
        run: make backup-test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o bh ./cmd/bh
          ./bh version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bh

  release-tooling:
    name: Release Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check shell scripts
        run: |
          shellcheck \
            install.sh \
            scripts/build-release-artifacts.sh \
            scripts/check-release-metadata.sh \
            scripts/render-homebrew-formula.sh \
            scripts/test-release-tooling.sh \
            scripts/verify-published-release.sh \
            scripts/verify-release-artifacts.sh

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Test release tooling and reproducibility
        run: make release-test
