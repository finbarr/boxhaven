<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'">
  <title>BoxHaven</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <header class="titlebar"><span>BoxHaven</span></header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-heading"><div class="brand"><img src="logo.png" alt=""><h1>BoxHaven</h1><span id="count">0</span></div><button id="refresh" class="icon-button" aria-label="Refresh boxes" title="Refresh boxes (⌘R)">↻</button></div>
      <button id="new-box" class="new-box"><span aria-hidden="true">+</span> New box</button>
      <button id="creation-notice" class="creation-notice" hidden></button>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a box…" aria-label="Find a box" autocomplete="off"><kbd>⌘K</kbd></div>
      <div id="list-error" class="list-error" role="alert" hidden></div>
      <nav id="boxes" aria-label="Your boxes"></nav>
      <div class="sidebar-footer"><span id="fleet-status" role="status">Connecting…</span><button id="settings" class="icon-button" aria-label="Connection settings" title="Connection settings">⚙</button></div>
    </aside>
    <main>
      <header id="session-header" hidden>
        <div class="session-heading"><span id="box-portrait"></span><div><div class="box-title"><h2 id="box-name"></h2><span id="box-creator"></span></div><p id="box-meta"></p></div></div>
        <div class="session-actions"><span id="connection-state" role="status"></span><button id="open-preview">Open preview ↗</button><button id="reconnect" hidden>Reconnect</button><button id="box-actions" aria-label="Box actions" aria-expanded="false" popovertarget="box-menu">•••</button></div>
      </header>
      <p id="provider-expiry" role="status" hidden></p>
      <p id="action-error" role="alert" hidden></p>
      <section id="welcome" class="welcome">
        <img src="logo.png" alt="A smiling BoxHaven box">
        <h2 id="welcome-title">Loading…</h2>
        <div id="empty-guide" hidden><button id="create-first-box" class="primary">Create box</button></div>
      </section>
      <div id="terminals" hidden></div>
    </main>
  </div>
  <div id="box-menu" popover><button id="rename-box">Rename box</button><button id="destroy-box" class="danger">Destroy box…</button></div>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <div class="dialog-heading"><div class="box-title"><span id="create-portrait" aria-hidden="true"></span><h2 id="create-title">New box</h2></div><button type="button" id="close-create" class="icon-button" aria-label="Close new box">×</button></div>
      <label for="new-box-name">Box name</label><input id="new-box-name" placeholder="work" required maxlength="63" pattern="[a-z0-9]+(-[a-z0-9]+)*" title="Lowercase letters, numbers, and single hyphens between words" autocomplete="off" spellcheck="false" autofocus>
      <div class="field-row">
        <div><label for="create-provider">Provider</label><select id="create-provider" required disabled></select></div>
        <div><label for="create-region">Region</label><input id="create-region" list="create-regions" placeholder="Default" maxlength="63" autocomplete="off" spellcheck="false" disabled><datalist id="create-regions"></datalist></div>
      </div>
      <fieldset id="size-options"><legend>Size</legend><div id="create-size"></div></fieldset>
      <div id="size-summary" hidden><span id="size-hardware"></span><strong id="size-price"></strong></div>
      <p id="size-description" hidden></p>
      <p id="catalog-status" role="status"></p><button id="retry-catalog" type="button" hidden>Retry</button>
      <p id="create-status" role="status" aria-live="polite"></p>
      <button id="create-box" class="primary" type="submit" disabled>Create box</button>
    </form>
  </dialog>
  <dialog id="rename-dialog" aria-labelledby="rename-title">
    <form id="rename-form">
      <div class="dialog-heading"><h2 id="rename-title">Rename box</h2><button type="button" id="close-rename" class="icon-button" aria-label="Cancel rename">×</button></div>
      <label for="rename-name">Box name</label><input id="rename-name" required maxlength="63" pattern="[a-z0-9]+(-[a-z0-9]+)*" autocomplete="off" spellcheck="false">
      <p id="rename-status" role="status"></p>
      <button id="save-name" class="primary" type="submit">Save</button>
    </form>
  </dialog>
  <dialog id="settings-dialog">
    <form id="login-form">
      <div class="dialog-heading"><h2>Connection</h2><button type="button" id="close-settings" class="icon-button" aria-label="Close settings">×</button></div>
      <label for="backend-url">Backend URL</label><input id="backend-url" type="url" placeholder="Configured backend" title="Leave blank to keep your backend. For a new connection, enter https://api.boxhaven.dev or your server URL.">
      <p id="login-status" role="status"></p>
      <button id="close-connections" type="button">Close local connections</button>
      <button id="login" class="primary" type="submit">Sign in</button>
    </form>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>
