<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoxHaven · Light paper</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f7f6f1;color:#243a31;font:15px system-ui}header{max-width:1560px;margin:0 auto 30px}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 8px}p{color:#66756d;margin:8px 0 16px;line-height:1.5}header a{color:#34745d;margin-right:18px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;max-width:1560px;margin:auto}figure{margin:0;min-width:0}h2{font-size:17px;margin:0 0 6px}figure p{font-size:13px;min-height:20px}.image-link{display:block;background:#efeee8;border:1px solid #dfddd3;border-radius:10px;overflow:hidden}img{width:100%;display:block}figure.icon .image-link{display:grid;place-items:center;height:380px;background:#e5e4df}figure.icon img{width:260px}a:focus-visible,button:focus-visible{outline:3px solid #34745d;outline-offset:4px}dialog{padding:0;border:0;max-width:96vw;max-height:94vh;background:#f7f6f1;border-radius:10px}dialog::backdrop{background:#172c26df}dialog img{max-width:94vw;max-height:90vh;width:auto;object-fit:contain}dialog button{position:fixed;right:18px;top:12px;border:1px solid #dfddd3;border-radius:8px;background:#f7f6f1;color:#243a31;padding:10px 16px;cursor:pointer}@media(max-width:800px){body{padding:20px}main{grid-template-columns:1fr}}
</style><header><h1>BoxHaven · Light paper</h1><p>Seven review concepts · Independent boxes, shared with your team · Smaller portraits and the existing cabin logo.</p><a href="README.md">Design notes</a><a href="prompts.json">Imagegen prompts</a><a href="../desktop-concepts/index.html">Earlier explorations</a></header><main><figure class=""><h2>Desktop · Your boxes</h2><p>Smaller box portraits, team context, and a light terminal.</p><a class="image-link" href="01-desktop.png"><img src="01-desktop.png" alt="Desktop · Your boxes" loading="lazy"></a></figure><figure class=""><h2>Website · Home</h2><p>Independent tasks, one place to manage them, shared with teammates.</p><a class="image-link" href="02-website.png"><img src="02-website.png" alt="Website · Home" loading="lazy"></a></figure><figure class=""><h2>Web console · Boxes</h2><p>The same portraits and controls in a quiet fleet table.</p><a class="image-link" href="03-console.png"><img src="03-console.png" alt="Web console · Boxes" loading="lazy"></a></figure><figure class=""><h2>Creation · A box with an identity</h2><p>Visible size choices and specs, with a small identity preview.</p><a class="image-link" href="04-creation.png"><img src="04-creation.png" alt="Creation · A box with an identity" loading="lazy"></a></figure><figure class=""><h2>Console · Box details</h2><p>Compact portrait, team access, clear machine details.</p><a class="image-link" href="05-box-detail.png"><img src="05-box-detail.png" alt="Console · Box details" loading="lazy"></a></figure><figure class=""><h2>Details · Box family and interaction states</h2><p>Selection, rename, copy feedback, and modest empty-state characters.</p><a class="image-link" href="06-delight-details.png"><img src="06-delight-details.png" alt="Details · Box family and interaction states" loading="lazy"></a></figure><figure class="icon"><h2>Dock icon · White tile</h2><p>Existing cabin artwork on a white rounded tile with a soft shadow.</p><a class="image-link" href="07-dock-icon.png"><img src="07-dock-icon.png" alt="Dock icon with white rounded tile" loading="lazy"></a></figure></main><dialog aria-label="Enlarged design"><button aria-label="Close enlarged design">Close ×</button><img alt=""></dialog><script>const d=document.querySelector('dialog');document.querySelectorAll('.image-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();d.querySelector('img').src=a.href;d.querySelector('img').alt=a.querySelector('img').alt;d.showModal()}));d.querySelector('button').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></html>
