</style><header><h1>BoxHaven · Design exploration</h1><p>Six imagegen mockups and the current app. Click any screen to enlarge. Mockup prices and icons are illustrative.</p><a href="prompts.json">Generation prompts</a></header><main class="grid"><figure><h2>A · Warm graphite</h2><p>Charcoal, amber, compact flat rows.</p><a href="a-warm-graphite.png"><img src="a-warm-graphite.png" alt="A · Warm graphite" loading="lazy"></a></figure><figure><h2>B · Light paper</h2><p>Ivory surfaces and forest green accents.</p><a href="b-light-paper.png"><img src="b-light-paper.png" alt="B · Light paper" loading="lazy"></a></figure><figure><h2>C · Cool slate</h2><p>Navy surfaces and ice blue accents.</p><a href="c-cool-slate.png"><img src="c-cool-slate.png" alt="C · Cool slate" loading="lazy"></a></figure><figure><h2>D · Native split</h2><p>Light Mac chrome around a dark terminal.</p><a href="d-native-split.png"><img src="d-native-split.png" alt="D · Native split" loading="lazy"></a></figure><figure><h2>E · Creation</h2><p>Visible size choices with specs and prices.</p><a href="e-create-box.png"><img src="e-create-box.png" alt="E · Creation" loading="lazy"></a></figure><figure><h2>F · Rename</h2><p>A small popover anchored to the box name.</p><a href="f-rename-box.png"><img src="f-rename-box.png" alt="F · Rename" loading="lazy"></a></figure><figure><h2>Current app</h2><p>Screenshot of the existing implementation using test data.</p><a href="current-app.png"><img src="current-app.png" alt="Current app" loading="lazy"></a></figure></main><dialog><button aria-label="Close enlarged image">Close ×</button><img alt=""></dialog><script>const d=document.querySelector('dialog');document.querySelectorAll('figure a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();d.querySelector('img').src=a.href;d.querySelector('img').alt=a.querySelector('img').alt;d.showModal()}));d.querySelector('button').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></html>
